; rookery firmware
;
; Default target is the ESP32-S3. Six discrete LEDs (red, green, blue, yellow,
; orange, white), one GPIO each, plus an optional servo.
;
;   pio run -e esp32s3 -t upload
;
; ---------------------------------------------------------------------------
; ESP32-S3 USB PORTS -- read this before you plug in
; ---------------------------------------------------------------------------
; A DevKitC-1 has TWO USB-C sockets:
;
;   "USB"  - native USB, wired straight to the chip (GPIO19/20)
;   "UART" - the CP2102/CH343 serial bridge
;
; The default env below sets ARDUINO_USB_CDC_ON_BOOT=1, which routes Serial to
; the NATIVE port. Plug into the one marked USB. If your board only has one
; socket, that's the native one and you're already correct.
;
; If you'd rather use the UART bridge (handy if uploads are fussy, since it
; auto-resets without touching BOOT), build `esp32s3-uart` and plug into UART.
; ---------------------------------------------------------------------------

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; Shared LED pin map for the S3. Audited against the S3's reserved GPIOs:
; avoids strapping pins (0, 3, 45, 46), the native USB pins (19, 20), SPI
; flash (26-32), octal PSRAM (33-37), UART0 (43, 44) and the onboard RGB LED
; (38 on DevKitC-1 v1.0, 48 on v1.1).
[s3_pins]
build_flags =
    -DPIN_RED=4
    -DPIN_GREEN=5
    -DPIN_BLUE=6
    -DPIN_YELLOW=7
    -DPIN_ORANGE=15
    -DPIN_WHITE=16

; ---------------------------------------------------------------------------
; DEFAULT: ESP32-S3 over native USB
; ---------------------------------------------------------------------------
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${s3_pins.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 over the UART bridge instead
[env:esp32s3-uart]
board = esp32-s3-devkitc-1
build_flags =
    ${s3_pins.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

; ---------------------------------------------------------------------------
; ESP32-S3 with the servo-driven penguin
; The S3 has 8 LEDC channels: 6 LEDs + 1 servo = 7. Fits.
; ---------------------------------------------------------------------------
[env:esp32s3-penguin]
board = esp32-s3-devkitc-1
build_flags =
    ${s3_pins.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DENABLE_SERVO
    -DPIN_SERVO=17
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5

; ---------------------------------------------------------------------------
; Tuning: bake in the gain trims you found with the GAIN serial command.
; ---------------------------------------------------------------------------
[env:esp32s3-tuned]
board = esp32-s3-devkitc-1
build_flags =
    ${env:esp32s3.build_flags}
    -DGAIN_RED=130
    -DGAIN_BLUE=255
    -DGAIN_WHITE=255
    -DLVL_ASLEEP=170

; ---------------------------------------------------------------------------
; OTHER BOARDS
; ---------------------------------------------------------------------------

; Classic ESP32 DevKitC / WROOM-32 / NodeMCU-32S.
; Avoids strapping pins (0, 2, 12, 15), flash pins (6-11), input-only (34-39).
[env:esp32dev]
board = esp32dev
build_flags =
    -DPIN_RED=25
    -DPIN_GREEN=26
    -DPIN_BLUE=27
    -DPIN_YELLOW=32
    -DPIN_ORANGE=33
    -DPIN_WHITE=13

[env:esp32dev-penguin]
board = esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DENABLE_SERVO
    -DPIN_SERVO=14
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5

; ESP32-C3 / C6.
; NOTE: these chips have exactly 6 LEDC channels, which the 6 LEDs consume
; entirely. No servo on these boards.
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_RED=0
    -DPIN_GREEN=1
    -DPIN_BLUE=3
    -DPIN_YELLOW=4
    -DPIN_ORANGE=5
    -DPIN_WHITE=6

[env:esp32c6]
board = esp32-c6-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_RED=0
    -DPIN_GREEN=1
    -DPIN_BLUE=2
    -DPIN_YELLOW=3
    -DPIN_ORANGE=10
    -DPIN_WHITE=11

; ---------------------------------------------------------------------------
; ALTERNATE LED BACKENDS -- if you ever swap the six LEDs for something else
; ---------------------------------------------------------------------------

; Addressable WS2812B / SK6812 ring
[env:esp32s3-neopixel]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_BACKEND_NEOPIXEL
    -DLED_PIN=4
    -DLED_COUNT=12
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3

; Single 4-pin common-cathode RGB LED (add -DRGB_COMMON_ANODE=1 if needed)
[env:esp32s3-rgb]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_BACKEND_RGB
    -DPIN_R=4
    -DPIN_G=5
    -DPIN_B=6
